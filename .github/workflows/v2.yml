# Tests de la v2 (docs/v2-procedure-tests.md) :
#   - rapides (T0 à T4, dont y/hub contre PostgreSQL et Redis) à chaque envoi
#     qui touche v2/ ;
#   - pile complète (T5) sur trois moteurs : Chromium, WebKit (Safari), Firefox ;
#   - en ligne (T6) contre v2.amend.ink chaque nuit, à la demande, et après
#     chaque envoi sur main, une fois le commit en ligne (WebSocket et ports compris, ce que la session de
#     Claude ne peut pas faire). Secret du dépôt : V2_JETON_ESSAI (clé d'essai, 09/11/2026).
name: v2

on:
  push:
    branches: [main, 'claude/**']
    paths: ['v2/**', '.github/workflows/v2.yml']
  pull_request:
    paths: ['v2/**', '.github/workflows/v2.yml']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: v2

env:
  V2_SERVICES_EXTERNES: '1'
  V2_POSTGRES: postgres://amendv2:amendv2-dev@127.0.0.1:5432/amendv2_yhub
  V2_REDIS: redis://127.0.0.1:6379

jobs:
  rapides:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: amendv2
          POSTGRES_PASSWORD: amendv2-dev
          POSTGRES_DB: amendv2_yhub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U amendv2 -d amendv2_yhub" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - name: Lint (couches, styles, textes)
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: T0 à T4
        run: npm test

  pile:
    if: github.event_name != 'schedule'
    needs: rapides
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        navigateur: [chromium, webkit, firefox]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: amendv2
          POSTGRES_PASSWORD: amendv2-dev
          POSTGRES_DB: amendv2_yhub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U amendv2 -d amendv2_yhub" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      # Le miroir Ubuntu de GitHub est parfois très lent (WebKit, 10/11/2026 :
      # 20 minutes d'installation, tâche coupée) : 10 minutes par essai, deux essais.
      - name: Installer ${{ matrix.navigateur }}
        run: |
          for i in 1 2; do
            timeout 600 npx playwright install --with-deps ${{ matrix.navigateur }} && exit 0
            echo "::warning::installation de ${{ matrix.navigateur }} : essai $i échoué ou trop long"
          done
          exit 1
      - name: T5 (${{ matrix.navigateur }})
        run: npm run test:pile
        env:
          NAVIGATEUR: ${{ matrix.navigateur }}

  en-ligne:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Vérifier que les secrets sont posés
        run: test -n "$V2_JETON_ESSAI" || { echo "::error::secret V2_JETON_ESSAI absent (Settings, Secrets and variables, Actions)"; exit 1; }
        env:
          V2_JETON_ESSAI: ${{ secrets.V2_JETON_ESSAI }}
      # Après une fusion, le VPS déploie main seul (deploy/auto/, minuteur de
      # 3 minutes, v1 puis v2) : sans cette attente, T6 tombe sur le
      # redémarrage de la v2 (502). On attend que la v2 serve le commit poussé,
      # puis on teste cette version-là.
      - name: Attendre que v2.amend.ink serve ce commit
        if: github.event_name == 'push'
        run: |
          attendu="${GITHUB_SHA:0:7}"
          for i in $(seq 1 60); do
            version=$(curl -fsS --max-time 10 https://v2.amend.ink/api/config 2>/dev/null | sed -n 's/.*"version":"\([0-9a-f]*\)".*/\1/p' || true)
            if [ "$version" = "$attendu" ]; then echo "v2.amend.ink sert $attendu"; exit 0; fi
            echo "en ligne : ${version:-indisponible}, attendu : $attendu (essai $i/60)"
            sleep 15
          done
          echo "::error::v2.amend.ink ne sert pas $attendu au bout de 15 minutes (journalctl -u amend-maj sur le VPS)"
          exit 1
      - name: T6 (v2.amend.ink)
        run: npm run test:en-ligne
        env:
          V2_JETON_ESSAI: ${{ secrets.V2_JETON_ESSAI }}
