services:
  collabtext:
    build: .
    ports:
      - '8787:8787'
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Dans un conteneur, le serveur doit écouter hors de la boucle locale (S19).
      - HOST=0.0.0.0
    volumes:
      - collabtext-data:/app/data
    restart: unless-stopped

volumes:
  collabtext-data:
